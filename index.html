<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Team Scouting Dashboard</title>
    <!-- Подключаем официальный клиент Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Inter, sans-serif; }
        body { background-color: #16191c; color: #e1e6eb; display: flex; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: 240px; background-color: #1e2226; border-right: 1px solid #2d3339; display: flex; flex-direction: column; padding: 20px 10px; position: fixed; height: 100vh; }
        .logo { font-weight: 900; font-size: 20px; color: #ff5500; text-transform: uppercase; padding-left: 15px; margin-bottom: 40px; letter-spacing: 1px; }
        .logo span { color: #fff; }
        .menu-item { display: flex; align-items: center; padding: 12px 15px; color: #a2a8b3; text-decoration: none; border-radius: 6px; font-weight: 600; margin-bottom: 5px; transition: all 0.2s; }
        .menu-item:hover, .menu-item.active { background-color: #2d3339; color: #fff; }
        .menu-item.active { border-left: 4px solid #ff5500; border-radius: 0 6px 6px 0; }
        .main-content { margin-left: 240px; flex: 1; padding: 40px; background: radial-gradient(circle at top right, #251d1a 0%, #16191c 50%); }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .dash-header h1 { font-size: 28px; font-weight: 800; text-transform: uppercase; }
        .faceit-btn { background-color: #ff5500; color: #fff; border: none; padding: 12px 24px; font-weight: 700; font-size: 14px; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .faceit-btn:hover { background-color: #e04b00; }
        .section-title { font-size: 14px; text-transform: uppercase; color: #8c94a0; letter-spacing: 1px; margin-bottom: 15px; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .player-card { background-color: #1e2226; border: 1px solid #2d3339; border-radius: 8px; padding: 20px; position: relative; transition: border-color 0.2s; }
        .player-card:hover { border-color: #4b525d; }
        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .lvl-badge { background-color: #ff5500; color: #fff; font-weight: 900; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 14px; }
        .player-name { font-weight: 700; font-size: 18px; }
        .player-role { font-size: 12px; color: #ff5500; text-transform: uppercase; font-weight: 700; }
        .card-body { font-size: 14px; color: #a2a8b3; margin-bottom: 15px; min-height: 45px; word-break: break-word; }
        .card-footer { border-top: 1px solid #2d3339; padding-top: 15px; display: flex; justify-content: space-between; }
        .status-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; }
        .status-review { background-color: rgba(255, 170, 0, 0.1); color: #ffaa00; }
        .status-accepted { background-color: rgba(0, 200, 100, 0.1); color: #00c864; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background-color: #1e2226; border: 1px solid #2d3339; width: 100%; max-width: 500px; border-radius: 8px; padding: 30px; }
        .modal-box h2 { margin-bottom: 20px; text-transform: uppercase; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; text-transform: uppercase; color: #8c94a0; margin-bottom: 5px; font-weight: 600;}
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background-color: #16191c; border: 1px solid #2d3339; border-radius: 4px; color: #fff; }
        .form-group input:focus { border-color: #ff5500; outline: none; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;}
        .cancel-btn { background: none; border: none; color: #a2a8b3; cursor: pointer; font-weight: 600; padding: 10px;}
        .no-players { color: #8c94a0; font-size: 14px; grid-column: 1 / -1; text-align: center; padding: 20px; border: 1px dashed #2d3339; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">CS2<span>Hub</span></div>
        <a href="index.html" class="menu-item active">Дашборд</a>
        <a href="team.html" class="menu-item">Мой Стак</a>
        <a href="tournaments.html" class="menu-item">Турниры</a>
    </div>

    <div class="main-content">
        <div class="dash-header">
            <div>
                <h1>Набор в Стак</h1>
                <p style="color: #8c94a0; margin-top: 5px;">Актуальный скаутинг игроков</p>
            </div>
            <button class="faceit-btn" onclick="toggleModal(true)">Подать анкету</button>
        </div>

        <div class="section-title">Текущий Ростер</div>
        <div class="grid">
            <div class="player-card" style="border-left: 4px solid #00c864;">
                <div class="card-header">
                    <div class="lvl-badge">10</div>
                    <div>
                        <div class="player-name">Zeus_Junior</div>
                        <div class="player-role">IGL / Капитан</div>
                    </div>
                </div>
                <div class="card-body">Основатель стака. Координирую игру, расписываю демки. Ищу жестких рифлеров.</div>
                <div class="card-footer">
                    <span class="status-tag status-accepted">В составе</span>
                </div>
            </div>
        </div>

        <div class="section-title">Кандидаты на рассмотрении</div>
        <div class="grid" id="candidates-grid">
            <div class="no-players">Загрузка кандидатов...</div>
        </div>
    </div>

    <div class="modal-overlay" id="formModal">
        <div class="modal-box">
            <h2>Подать заявку в команду</h2>
            <form id="scoutingForm" onsubmit="event.preventDefault(); sendData();">
                <div class="form-group">
                    <label>Никнейм</label>
                    <input type="text" id="form-nickname" required>
                </div>
                <div class="form-group">
                    <label>FACEIT LEVEL / Эло</label>
                    <input type="text" id="form-elo" placeholder="Например: 10" required>
                </div>
                <div class="form-group">
                    <label>Роль в игре</label>
                    <select id="form-role">
                        <option>Rifler (Стрелок)</option>
                        <option>AWPer (Снайпер)</option>
                        <option>Entry Fragger</option>
                        <option>Support</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>О себе (Опыт, прайм)</label>
                    <textarea id="form-about" rows="3" required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="toggleModal(false)">Отмена</button>
                    <button type="submit" class="faceit-btn">Отправить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Самая первая очередь: Создаем подключение к базе данных!
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_L0eOvR_OkbehqxTcNiZOA_Rw1i3jqw"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function toggleModal(show) {
            const modal = document.getElementById('formModal');
            modal.style.display = show ? 'flex' : 'none';
        }

        async function loadCandidates() {
            const grid = document.getElementById('candidates-grid');
            try {
                const { data: players, error } = await supabaseClient.from('players').select('*').eq('status', 'review');
                if (error) {
                    grid.innerHTML = `<div class="no-players">Ошибка Supabase: ${error.message}</div>`;
                    return;
                }
                if (!players || players.length === 0) {
                    grid.innerHTML = '<div class="no-players">Кандидатов пока нет. Будь первым!</div>';
                    return;
                }
                grid.innerHTML = '';
                players.forEach(player => {
                    grid.innerHTML += `
                        <div class="player-card">
                            <div class="card-header">
                                <div class="lvl-badge">${player.elo}</div>
                                <div>
                                    <div class="player-name">${player.nickname}</div>
                                    <div class="player-role">${player.role}</div>
                                </div>
                            </div>
                            <div class="card-body">${player.about}</div>
                            <div class="card-footer"><span class="status-tag status-review">Проверка</span></div>
                        </div>`;
                });
            } catch (err) {
                grid.innerHTML = `<div class="no-players">Критическая ошибка: ${err.message}</div>`;
            }
        }

        async function sendData() {
            try {
                const nickname = document.getElementById('form-nickname').value;
                const elo = document.getElementById('form-elo').value;
                const role = document.getElementById('form-role').value;
                const about = document.getElementById('form-about').value;

                const { error } = await supabaseClient.from('players').insert([{ nickname, elo, role, about, status: 'review' }]);
                
                if (error) {
                    alert('Ошибка при записи в базу: ' + error.message);
                } else {
                    alert('Анкета успешно отправлена в базу данных!');
                    toggleModal(false);
                    document.getElementById('scoutingForm').reset();
                    loadCandidates();
                }
            } catch (err) {
                alert('Ошибка отправки: ' + err.message);
            }
        }

        window.onload = loadCandidates;
    </script>
</body>
</html>
