<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Стак | CS2Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Inter, sans-serif; }
        body { background-color: #16191c; color: #e1e6eb; display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background-color: #1e2226; border-right: 1px solid #2d3339; display: flex; flex-direction: column; padding: 20px 10px; position: fixed; height: 100vh; }
        .logo { font-weight: 900; font-size: 20px; color: #ff5500; text-transform: uppercase; padding-left: 15px; margin-bottom: 40px; letter-spacing: 1px; }
        .logo span { color: #fff; }
        .menu-item { display: flex; align-items: center; padding: 12px 15px; color: #a2a8b3; text-decoration: none; border-radius: 6px; font-weight: 600; margin-bottom: 5px; transition: all 0.2s; }
        .menu-item:hover, .menu-item.active { background-color: #2d3339; color: #fff; }
        .menu-item.active { border-left: 4px solid #ff5500; border-radius: 0 6px 6px 0; }
        .main-content { margin-left: 240px; flex: 1; padding: 40px; background: radial-gradient(circle at top right, #1d2520 0%, #16191c 50%); }
        .dash-header { margin-bottom: 40px; }
        .dash-header h1 { font-size: 28px; font-weight: 800; text-transform: uppercase; }
        .team-table { width: 100%; border-collapse: collapse; background-color: #1e2226; border: 1px solid #2d3339; border-radius: 8px; overflow: hidden; }
        .team-table th, .team-table td { padding: 15px 20px; text-align: left; }
        .team-table th { background-color: #1a1d20; color: #8c94a0; font-size: 12px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; border-bottom: 1px solid #2d3339; }
        .team-table td { border-bottom: 1px solid #2d3339; font-size: 15px; }
        .team-table tr:last-child td { border-bottom: none; }
        .role-badge { display: inline-block; padding: 4px 8px; background-color: rgba(255, 85, 0, 0.1); color: #ff5500; border-radius: 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .lvl-pill { background-color: #ff5500; color: #fff; padding: 2px 6px; border-radius: 3px; font-weight: 900; font-size: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">CS2<span>Hub</span></div>
        <a href="index.html" class="menu-item">Дашборд</a>
        <a href="team.html" class="menu-item active">Мой Стак</a>
        <a href="tournaments.html" class="menu-item">Турниры</a>
    </div>

    <div class="main-content">
        <div class="dash-header">
            <h1>Управление Командой</h1>
            <p style="color: #8c94a0; margin-top: 5px;">Редактирование текущего ростера стака</p>
        </div>

        <table class="team-table">
            <thead>
                <tr>
                    <th>Игрок</th>
                    <th>Роль</th>
                    <th>FACEIT</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="roster-table-body">
                <tr>
                    <td style="font-weight: 700; color: #fff;">Zeus_Junior <span style="color: #ffaa00; font-size: 12px;">(Капитан)</span></td>
                    <td><span class="role-badge" style="background-color: rgba(212, 163, 89, 0.1); color: #d4a359;">IGL / Координатор</span></td>
                    <td><span class="lvl-pill">10</span></td>
                    <td style="color: #555;">—</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
